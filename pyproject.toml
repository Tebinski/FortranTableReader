[project]
name = "flatparse"
version = "0.1.0"
description = "Plugin-based parser for heterogeneous flat-text data files: FORTRAN reports, fixed-width tables, and delimited data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
examples = ["pandas>=3.0.3"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pandas>=3.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flatparse"]